# inkhash server from GHCR. See docs/DEPLOY.md.
#   cp env.example .env
#   mkdir -p data && sudo chown 1000:1000 data
#   docker compose up -d
#   docker compose logs inkhash          # setup token on the first start
name: inkhash

services:
  inkhash:
    image: ghcr.io/teamcato/inkhash-server:${INKHASH_VERSION:-latest}
    restart: unless-stopped
    # Docker publishes ports past ufw and firewalld; 127.0.0.1 keeps it on this machine.
    ports:
      - "${INKHASH_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - ./data:/data
    environment:
      # .1 is a reverse proxy on the host, if there is one. See ADR 0038.
      INKHASH_TRUSTED_PROXIES: "172.31.87.1"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      inkhash: {}

networks:
  inkhash:
    ipam:
      config:
        - subnet: 172.31.87.0/24
