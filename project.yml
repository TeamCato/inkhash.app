name: Inkhash
options:
  bundleIdPrefix: local.inkhash
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  MARKETING_VERSION: "0.5.0"
  CURRENT_PROJECT_VERSION: "5"
packages:
  InkhashCore:
    path: Packages/InkhashCore
  # KennelKit, Kennel's Swift client (ADR 0073). The app uses its types directly, so it links the product itself.
  kennel:
    url: https://github.com/teamcato/kennel
    minorVersion: 0.6.1
targets:
  Inkhash:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iOS
        excludes:
          - Info.plist
      - path: App/Resources
    dependencies:
      - package: InkhashCore
        product: InkhashCore
      - package: kennel
        product: KennelKit
      - package: kennel
        product: KennelKitUI
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: local.inkhash.ipad
      PRODUCT_NAME: Inkhash
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: App/iOS/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: inkhash
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
  InkhashMac:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
        excludes:
          - Info.plist
          - Inkhash.entitlements
      - path: App/Resources
    dependencies:
      - package: InkhashCore
        product: InkhashCore
      - package: kennel
        product: KennelKit
      - package: kennel
        product: KennelKitUI
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: local.inkhash.mac
      PRODUCT_NAME: Inkhash
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: App/macOS/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: inkhash
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      ENABLE_APP_SANDBOX: NO
      CODE_SIGN_ENTITLEMENTS: App/macOS/Inkhash.entitlements
  InkhashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: Inkhash
      - package: InkhashCore
        product: InkhashCore
      - package: kennel
        product: KennelKit
      - package: kennel
        product: KennelKitUI
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: local.inkhash.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/Inkhash.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Inkhash
      BUNDLE_LOADER: $(TEST_HOST)
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
  InkhashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: Inkhash
      - package: InkhashCore
        product: InkhashCore
      - package: kennel
        product: KennelKit
      - package: kennel
        product: KennelKitUI
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: local.inkhash.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Inkhash
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
  InkhashMacTests:
    # The Mac editor without the app: no host, so tests never open the real library. Shared code is
    # compiled in directly.
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/MacTests
    dependencies:
      - package: InkhashCore
        product: InkhashCore
      - package: kennel
        product: KennelKit
      - package: kennel
        product: KennelKitUI
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: local.inkhash.mactests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
schemes:
  InkhashMacTests:
    build:
      targets:
        InkhashMacTests: all
    test:
      targets:
        - InkhashMacTests
  Inkhash:
    build:
      targets:
        Inkhash: all
    test:
      targets:
        - InkhashTests
        - InkhashUITests
