# Agents push their own branch, never main, no pull requests. This Mac tests everything,
# and fast-forwards main on green. Installing is not its job. See ADR 0064 and docs/RELEASE.md.
# The repository is public: never add a pull_request or pull_request_target trigger here,
# it would run fork code on the Mac.
name: CI

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository_owner == 'teamCato' && github.actor == 'nikdom'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
      - name: Branch fast-forwards main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "::error::Branch liegt hinter main. git rebase origin/main, dann git push --force-with-lease."
            exit 1
          }
      - run: make test
      - run: make app-test
      - run: make ui-test
      - run: make mac
      - run: make ipad
      - run: make iphone

  main:
    needs: test
    runs-on: [self-hosted, macOS]
    concurrency:
      group: main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: false
      # SSH key of the Mac user, not GITHUB_TOKEN: the token may not touch workflow files,
      # and its pushes would not start other workflows on main.
      - name: Fast-forward main
        run: |
          remote=git@github.com:${{ github.repository }}.git
          git fetch --no-tags "$remote" main
          git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA" || {
            echo "::error::main ist weitergelaufen. Branch auf origin/main umbauen und neu schieben."
            exit 1
          }
          git push "$remote" "$GITHUB_SHA:refs/heads/main"
