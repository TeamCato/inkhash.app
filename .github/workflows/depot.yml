# Every commit on main is installed on the runner Mac (/Applications) and lands in the depot
# (teamCato/depot, internal download page): the Mac app as a zip, the iPad/iPhone app as an over-the-air install. ci.yml has already tested the commit
# before it fast-forwarded main; this workflow only builds and files.
# The repository is public: never add a pull_request or pull_request_target trigger here,
# it would run fork code on the Mac.
name: Depot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depot
  cancel-in-progress: true

jobs:
  depot:
    if: github.repository_owner == 'teamCato'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    # KennelKit comes from the private repository kennel, over SSH as in ci.yml.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.git@github.com:.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - uses: actions/checkout@v5
        env:
          GIT_CONFIG_COUNT: "0"
        with:
          fetch-depth: 0
          clean: false
      # Signing team from the Mac's install config, the same one tools/install-local.sh reads.
      # The build number counts commits, as in install-local.sh, so the depot sorts newest first.
      - name: Signing and build number
        run: |
          config="$HOME/.config/inkhash/install.env"
          [[ -f "$config" ]] || { echo "::error::$config fehlt, siehe docs/RELEASE.md."; exit 1; }
          source "$config"
          : "${TEAM:?TEAM in $config setzen}"
          echo "TEAM=$TEAM" >>"$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >>"$GITHUB_ENV"
      # The upload script lives in the private depot repo; the Mac user's SSH key may read it.
      - name: Fetch depot script
        run: |
          rm -rf "$RUNNER_TEMP/depot"
          git clone -q --depth 1 git@github.com:TeamCato/depot.git "$RUNNER_TEMP/depot"
          echo "PUBLISH=$RUNNER_TEMP/depot/scripts/publish.sh" >>"$GITHUB_ENV"
      # A Package.resolved from an earlier run would pin an old KennelKit revision, see ci.yml.
      - name: Newest KennelKit
        run: find . -name Package.resolved -not -path './.build/*' -delete
      - run: xcodegen generate
      - name: Mac app
        run: |
          xcodebuild -scheme InkhashMac -destination 'platform=macOS' -derivedDataPath .build/depot-mac \
            -allowProvisioningUpdates CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="Apple Development" \
            CURRENT_PROJECT_VERSION="$BUILD" build -quiet
          "$PUBLISH" .build/depot-mac/Build/Products/Debug/Inkhash.app
      # This Mac is Dominik's own: every main build replaces the app in /Applications. A running copy
      # is quit (killed if it does not quit), replaced and opened again, without asking. The old copy
      # goes to the Trash, not away for good.
      - name: Install on this Mac
        env:
          APP: .build/depot-mac/Build/Products/Debug/Inkhash.app
        run: |
          name=$(basename "$APP")
          target="/Applications/$name"
          bundle_id=$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")
          osascript -e "quit app id \"$bundle_id\"" 2>/dev/null || true
          for _ in $(seq 20); do
            pgrep -f "$target/Contents/MacOS/" >/dev/null || break
            sleep 0.5
          done
          pkill -f "$target/Contents/MacOS/" || true
          if [[ -e "$target" ]]; then
            mv "$target" "$HOME/.Trash/${name%.app} $(date +%Y-%m-%d-%H%M%S).app"
          fi
          # cp, not ditto, as in inkhash's tools/install-local.sh; -X copies no extended attributes.
          cp -R -X "$APP" /Applications/
          open "$target" || echo "::warning::$name installiert, aber nicht geöffnet (niemand angemeldet?)."
          echo "$name $(plutil -extract CFBundleVersion raw "$target/Contents/Info.plist") in /Applications"
      - name: iPad and iPhone app
        run: |
          xcodebuild -scheme Inkhash -destination 'generic/platform=iOS' -derivedDataPath .build/depot-ios \
            -allowProvisioningUpdates CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGNING_REQUIRED=YES CURRENT_PROJECT_VERSION="$BUILD" build -quiet
          "$PUBLISH" .build/depot-ios/Build/Products/Debug-iphoneos/Inkhash.app
