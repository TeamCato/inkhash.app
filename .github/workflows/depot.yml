# Every commit on main lands in the depot (teamCato/depot, internal download page): the Mac app
# as a zip, the iPad/iPhone app as an over-the-air install. ci.yml has already tested the commit
# before it fast-forwarded main; this workflow only builds and files.
# The repository is public: never add a pull_request or pull_request_target trigger here,
# it would run fork code on the Mac.
name: Depot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depot
  cancel-in-progress: true

jobs:
  depot:
    if: github.repository_owner == 'teamCato'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    # KennelKit comes from the private repository kennel, over SSH as in ci.yml.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.git@github.com:.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - uses: actions/checkout@v5
        env:
          GIT_CONFIG_COUNT: "0"
        with:
          fetch-depth: 0
          clean: false
      # Signing team from the Mac's install config, the same one tools/install-local.sh reads.
      # The build number counts commits, as in install-local.sh, so the depot sorts newest first.
      - name: Signing and build number
        run: |
          config="$HOME/.config/inkhash/install.env"
          [[ -f "$config" ]] || { echo "::error::$config fehlt, siehe docs/RELEASE.md."; exit 1; }
          source "$config"
          : "${TEAM:?TEAM in $config setzen}"
          echo "TEAM=$TEAM" >>"$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >>"$GITHUB_ENV"
      # The upload script lives in the private depot repo; the Mac user's SSH key may read it.
      - name: Fetch depot script
        run: |
          rm -rf "$RUNNER_TEMP/depot"
          git clone -q --depth 1 git@github.com:TeamCato/depot.git "$RUNNER_TEMP/depot"
          echo "PUBLISH=$RUNNER_TEMP/depot/scripts/publish.sh" >>"$GITHUB_ENV"
      - run: xcodegen generate
      - name: Mac app
        run: |
          xcodebuild -scheme InkhashMac -destination 'platform=macOS' -derivedDataPath .build/depot-mac \
            -allowProvisioningUpdates CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="Apple Development" \
            CURRENT_PROJECT_VERSION="$BUILD" build -quiet
          "$PUBLISH" .build/depot-mac/Build/Products/Debug/Inkhash.app
      - name: iPad and iPhone app
        run: |
          xcodebuild -scheme Inkhash -destination 'generic/platform=iOS' -derivedDataPath .build/depot-ios \
            -allowProvisioningUpdates CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGNING_REQUIRED=YES CURRENT_PROJECT_VERSION="$BUILD" build -quiet
          "$PUBLISH" .build/depot-ios/Build/Products/Debug-iphoneos/Inkhash.app
